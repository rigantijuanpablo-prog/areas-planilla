<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} | RGMA</title>
<style>
:root{--navy:#0A1931;--gold:#C8B090;--paper:#fcfcfc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--paper)}
.hero-area{position:relative;display:flex;height:52vh;min-height:420px;background:var(--navy);overflow:hidden}
.a-left{width:42%;display:flex;flex-direction:column;justify-content:center;padding:0 5% 0 6%;background:var(--navy)}
.a-right{width:58%;position:relative;overflow:hidden}
.a-right img{width:100%;height:100%;object-fit:cover;display:block}
.a-right::after{content:none!important} /* CORTE RECTO GARANTIZADO */
.eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:20px}
.h1{font-family:'Playfair Display';font-size:clamp(28px,3.2vw,44px);color:#fff;line-height:1; font-weight:300}
.desc{font-size:14px;line-height:1.7;color:rgba(255,255,255,.6);max-width:400px;margin-top:18px}
.content{max-width:1280px;margin:0 auto;padding:64px 40px;display:grid;grid-template-columns:1.2fr .8fr;gap:80px}
.bullets{list-style:none}
.bullets li{padding:16px 0;border-bottom:1px solid #eee;font-size:13px;line-height:1.6;color:#4A5A6F}
.bullets li b{color:var(--navy)}
.card{border:1px solid rgba(10,25,49,.1);padding:32px;background:#fff;position:sticky;top:100px}
@media(max-width:900px){.hero-area{flex-direction:column;height:auto}.a-left,.a-right{width:100%}.a-right{height:280px}.content{grid-template-columns:1fr;padding:32px 24px}}
</style>
</head>
<body>

<div class="hero-area">
  <div class="a-left">
    <div class="eyebrow">{{NUMERO}} — {{CATEGORIA}}</div>
    <h1 class="h1">{{H1_TITULO}}</h1>
    <p class="desc">{{DESCRIPCION_CORTA}}</p>
  </div>
  <div class="a-right"><img src="{{FOTO}}.webp" alt="{{TITLE}}"></div>
</div>

<div class="content">
  <div>
    <h2 style="font-family:'Playfair Display';font-size:26px;color:var(--navy);margin-bottom:24px">Qué hacemos en {{TITLE}}</h2>
    <ul class="bullets">
      {{BULLETS_HTML}}
    </ul>
  </div>
  <div><div class="card">
    <h3 style="font-family:'Playfair Display';margin-bottom:12px">Consulta {{TITLE}}</h3>
    <p style="font-size:12px;color:#6b7280;margin-bottom:20px">Respuesta en 24hs. Protocolo boutique RGMA.</p>
    <a href="/#contacto" style="display:block;text-align:center;background:var(--navy);color:#fff;padding:14px;font-size:10px;letter-spacing:2px;text-decoration:none">SOLICITAR REUNIÓN</a>
  </div></div>
</div>
</body>
</html>
